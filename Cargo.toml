[package]
name        = "caesar"
version     = "0.1.0"
edition     = "2024"
license     = "EUPL-1.2"
description = "Small CalDAV and CardDAV server for personal use"
keywords    = [ "caldav", "carddav", "webdav", "calendar", "contacts" ]
categories  = [ "web-programming::http-server" ]
readme      = "README.md"
repository  = "https://github.com/faukah/caesar"

[dependencies]
axum               = { version = "0.8.9", default-features = false, features = [ "http1", "tokio" ] }
blake3             = "1.8.7"
humantime          = "2.4.0"
quick-xml          = "0.42.0"
serde              = { version = "1.0.229", features = [ "derive" ] }
tokio              = { version = "1.53.2", features = [ "rt", "net", "macros", "signal" ] }
toml               = "1.1.7"
tracing            = { version = "0.1.44", default-features = false, features = [ "std" ] }
tracing-subscriber = { version = "0.3.23", features = [ "env-filter", "fmt" ] }
uuid               = { version = "1.27.0", features = [ "v7" ] }

[profile.release]
codegen-units = 1
lto           = "fat"

[lints.clippy]
# The lint groups above enable some less-than-desirable rules, we should manually
# enable those to keep our sanity.
absolute_paths                       = "allow"
arbitrary_source_item_ordering       = "allow"
cargo                                = { level = "warn", priority = -1 }
clone_on_ref_ptr                     = "warn"
complexity                           = { level = "warn", priority = -1 }
dbg_macro                            = "warn"
empty_drop                           = "warn"
empty_structs_with_brackets          = "warn"
exit                                 = "warn"
expect_used                          = "warn"
filetype_is_file                     = "warn"
get_unwrap                           = "warn"
implicit_return                      = "allow"
infinite_loop                        = "warn"
map_with_unused_argument_over_ranges = "warn"
missing_docs_in_private_items        = "allow"
non_ascii_literal                    = "allow"
non_std_lazy_statics                 = "warn"
nursery                              = { level = "warn", priority = -1 }
pathbuf_init_then_push               = "warn"
pattern_type_mismatch                = "allow"
pedantic                             = { level = "warn", priority = -1 }
perf                                 = { level = "warn", priority = -1 }
print_stderr                         = "warn"
print_stdout                         = "warn"
question_mark_used                   = "allow"
rc_buffer                            = "warn"
rc_mutex                             = "warn"
rest_pat_in_fully_bound_structs      = "warn"
similar_names                        = "allow"
single_call_fn                       = "allow"
std_instead_of_core                  = "allow"
style                                = { level = "warn", priority = -1 }
todo                                 = "warn"
too_long_first_doc_paragraph         = "allow"
too_many_lines                       = "allow"
undocumented_unsafe_blocks           = "warn"
unimplemented                        = "warn"
unnecessary_safety_comment           = "warn"
unreachable                          = "warn"
unused_result_ok                     = "warn"
unused_trait_names                   = "allow"
